# 星际征途在线对战服务器配置样例
# 复制为 config.yaml 并修改（config.yaml 不要提交到代码库）。
# 所有配置项均可被环境变量覆盖：CONQUEST_LISTEN / CONQUEST_MYSQL_DSN / WECHAT_APP_ID / WECHAT_SECRET / ALLOW_TEST_LOGIN

# 监听地址（HTTP /auth/wechat、/health 与 WS /ws 共用）
listen: ":8080"

# MySQL DSN；留空则使用内存存储（仅用于本地联调，重启丢数据）
mysqlDSN: "conquest:conquest123@tcp(127.0.0.1:3306)/conquest?parseTime=true&charset=utf8mb4&timeout=5s"

# 微信小程序密钥（mp.weixin.qq.com → 开发管理 → 开发设置）
wechatAppID: ""
wechatSecret: ""

# 允许 test_<id> 测试登录（浏览器预览/联调必须开启；生产环境建议关闭）
allowTestLogin: true

# 1v1 匹配等待真人超过该秒数后由 AI 补位
aiFillTimeoutSeconds: 15

# FFA 匹配等待超过该秒数后用 AI 补满 4 席
ffaAIFillTimeoutSeconds: 20

# 对局内断线重连窗口（秒），超时按投降处理
reconnectWindowSeconds: 30

# 开局倒计时（秒）
countdownSeconds: 3
